<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Sport Track</title>
</head>
<body>
<header>
  <h1>💪 Sport Track</h1>
  <button id="resetBtn" class="icon">↻</button>
</header>

<main>
<section id="home" class="screen active">
  <div class="hero">
    <div class="muted">Cette semaine</div>
    <div class="stats"><b id="weekSessions">0</b><span>séances</span><b id="weekMinutes">0</b><span>min</span></div>
  </div>
  <button id="startBtn" class="primary big">▶ Commencer une séance</button>
  <div class="cards">
    <button class="card" data-screen="plans">🏋️<strong>Mes séances</strong><small>Créer ou modifier</small></button>
    <button class="card" data-screen="history">📊<strong>Historique</strong><small>Voir mes progrès</small></button>
  </div>
</section>

<section id="plans" class="screen">
  <div class="section-title"><button class="back">←</button><h2>Mes séances</h2></div>
  <div id="planList"></div>
  <button id="newPlan" class="secondary">＋ Nouvelle séance</button>
</section>

<section id="workout" class="screen">
  <div class="section-title"><button id="cancelWorkout" class="back">←</button><h2 id="workoutTitle">Séance</h2></div>
  <div class="timer" id="sessionTimer">00:00</div>
  <div id="exerciseArea"></div>
  <button id="finishBtn" class="primary">✓ Terminer la séance</button>
</section>

<section id="summary" class="screen">
  <div class="done">🎉</div><h2>Séance terminée</h2>
  <div class="summary" id="summaryBox"></div>
  <button id="saveWorkout" class="primary big">💾 Enregistrer</button>
</section>

<section id="history" class="screen">
  <div class="section-title"><button class="back">←</button><h2>Historique</h2></div>
  <div id="historyList"></div>
</section>
</main>

<nav>
<button class="nav active" data-screen="home">🏠<span>Accueil</span></button>
<button class="nav" data-screen="plans">🏋️<span>Séances</span></button>
<button class="nav" data-screen="history">📊<span>Historique</span></button>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modalTitle">Nouvelle séance</h2>
    <input id="planName" placeholder="Nom de la séance">
    <textarea id="planExercises" placeholder="Exercices, un par ligne&#10;Pompes&#10;Squats&#10;Gainage"></textarea>
    <button id="createPlan" class="primary">Créer</button>
    <button id="closeModal" class="secondary">Annuler</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
